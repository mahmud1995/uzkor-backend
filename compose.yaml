services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: preorder
      POSTGRES_PASSWORD: preorder
      POSTGRES_DB: preorder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preorder -d preorder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: uzkor-api:local
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://preorder:preorder@db:5432/preorder
      PORT: "3000"
      ENABLE_DOCS: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres:
